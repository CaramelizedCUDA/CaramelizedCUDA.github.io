# Fuwari 版 GitHub Pages 部署工作流（已按 2026-11-14 直读的上游仓库核对）
#
# 用法：放到博客仓库的 .github/workflows/deploy.yml
# （仓库名 CaramelizedCUDA.github.io 待用户最后点头；没定之前先别建仓库）
#
# 和起步包里旧的 npm 版 deploy.yml 的区别，只有安装和构建这两步：
# - Fuwari 强制 pnpm：package.json 里有 "preinstall": "npx only-allow pnpm"，
#   npm ci 会直接被拦下，所以必须换成 pnpm。
# - 构建必须用 pnpm run build，不能只跑 pnpm astro build：
#   Fuwari 的 build 脚本是 "astro build && pagefind --site dist"，
#   只跑 astro build 会漏掉 Pagefind 搜索索引，站内搜索就是空的。
# - Fuwari 上游 main 分支没有自带 deploy.yml（2026-11-14 已核对，
#   .github/workflows 下只有 biome.yml 和 build.yml），所以这份是新建的，
#   不是从上游复制的。Node 22 / pnpm 9 的版本取自上游 build.yml
#  （Node 22、23 矩阵，pnpm/action-setup v4）和 README（Node >= 20，pnpm >= 9）。
#
# 其余部分（permissions、upload-pages-artifact、deploy-pages）沿用起步包旧版，
# 仓库 Settings → Pages → Source 选 GitHub Actions（选错会 404）那条提醒不变。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
